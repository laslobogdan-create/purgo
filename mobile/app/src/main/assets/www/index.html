<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'">
  <meta name="theme-color" content="#090a14">
  <title>Purgo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora"><span></span><span></span><span></span></div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#c66bff"/></linearGradient>
  </defs></svg>

  <div class="app">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="brand"><div class="logo" id="logo"></div><div><b>Purgo</b><small>Uninstaller &amp; Cleaner</small></div></div>
    <div class="meter"><div class="row1"><span><b id="m-used">–</b> used</span><span id="m-total">–</span></div><div class="bar"><i id="m-bar" style="width:0"></i></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="drawer-foot"><span>v1 · GPL-3.0</span><span id="freed-total"></span></div>
  </aside>

  <div class="selbar" id="selbar">
    <div class="t"><b id="sel-n"></b><span id="sel-s"></span></div>
    <button class="btn" id="sel-alt" style="width:46px;padding:0;display:none"></button>
    <button class="btn danger" id="sel-go"></button>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="icons.js"></script>
  <script src="bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
